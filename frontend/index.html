<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciamento de Clientes </title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Gerenciamento de Clientes</h1>
      <p>Cadastre e administre os clientes da empresa</p>
    </header>

    <main>
      <!-- Formulario de Cadastro / Edicao -->
      <section class="card">
        <h2 id="form-title">Cadastrar Novo Cliente</h2>
        <form id="client-form">
          <input type="hidden" id="client-id">
          
          <div class="form-group">
            <label for="nome">Nome *</label>
            <input type="text" id="nome" placeholder="Digite o nome completo" required>
          </div>

          <div class="form-group">
            <label for="email">E-mail *</label>
            <input type="email" id="email" placeholder="exemplo@email.com" required>
          </div>

          <div class="form-group">
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" placeholder="(00) 00000-0000">
          </div>

          <div class="form-actions">
            <button type="submit" id="btn-save" class="btn btn-primary">Salvar</button>
            <button type="button" id="btn-cancel" class="btn btn-secondary" style="display: none;">Cancelar</button>
          </div>
        </form>
      </section>

      <!-- Listagem de Clientes -->
      <section class="card">
        <h2>Lista de Clientes</h2>
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Telefone</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="client-table-body">
              <!-- Linhas inseridas dinamicamente via JS -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
